# Job 2 of 2: send the email the build job prepared.
# Tue-Sat 7:00 AM America/New_York (the morning after each build). send_email.py exits without sending
# if there's no new episode, the build is stale, or the summary is empty.
name: MFM send

on:
  schedule:
    - cron: "0 11 * * 2-6"   # 7 AM EDT (Tue-Sat)
    - cron: "0 12 * * 2-6"   # 7 AM EST (Tue-Sat)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mfm-state
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
    steps:
      - name: ET gate (skip the off-season UTC trigger)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then want="0 11 * * 2-6"; else want="0 12 * * 2-6"; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not 7 AM ET for this trigger; skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -q -r requirements.txt

      - name: Restore state
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p .tmp && cp state/*.json state/*.html .tmp/ 2>/dev/null || true

      - name: Send
        if: steps.gate.outputs.run == 'true'
        run: python tools/send_email.py

      - name: Save state
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          cp .tmp/last_sent_episode.json state/ 2>/dev/null || true
          git config user.name "mfm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "send: $(date -u +%F) mark episode sent"
          git pull --rebase -q && git push -q
