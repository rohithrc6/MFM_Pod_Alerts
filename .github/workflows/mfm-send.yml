# Job 2 of 2: send the emails the build job prepared -- one per new episode,
# oldest first. Tue-Sat 6:47 AM America/New_York (the morning after each build).
# send_email.py skips episodes already sent and refuses any episode whose
# build is stale, whose title doesn't match, or whose summary is empty.
name: MFM send

on:
  schedule:
    - cron: "47 10 * * 2-6"  # 6:47 AM EDT (Tue-Sat); off :00, GitHub is busiest on the hour
    - cron: "47 11 * * 2-6"  # 6:47 AM EST (Tue-Sat)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mfm-state
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
    steps:
      - name: ET gate (skip the off-season UTC trigger)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then want="47 10 * * 2-6"; else want="47 11 * * 2-6"; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not 6:47 AM ET for this trigger; skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -q -r requirements.txt

      - name: Restore state
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p .tmp && cp -R state/. .tmp/

      - name: Send
        if: steps.gate.outputs.run == 'true'
        run: python tools/send_email.py

      - name: Save state
        # always(): with several episodes, the first may be sent before a later
        # one fails -- its last_sent update must still be saved, or it would be
        # sent again on retry.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          cp .tmp/last_sent_episode.json state/ 2>/dev/null || true
          git config user.name "mfm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "send: $(date -u +%F) mark episode(s) sent"
          git pull --rebase -q && git push -q
