# Job 1 of 2: scrape -> transcribe -> summarize -> build.
# Mon-Fri 10:17 PM America/New_York. Handles every episode published since
# the last send; one email per episode is committed to state/emails/ so the
# send job (mfm-send.yml) can pick them up the next morning.
name: MFM build

on:
  schedule:
    # GitHub cron is UTC-only. Both entries fire; the "ET gate" step below
    # keeps whichever one is 10:17 PM in New York right now (EDT vs EST).
    # 10 PM ET is already the next day in UTC, hence weekdays 2-6 (Tue-Sat UTC).
    - cron: "17 2 * * 2-6"   # 10:17 PM EDT (Mon-Fri ET); off :00, GitHub is busiest on the hour
    - cron: "17 3 * * 2-6"   # 10:17 PM EST (Mon-Fri ET)
  workflow_dispatch:
    inputs:
      title:
        description: 'Optional: build one specific episode by (part of) its title, e.g. "dying rich" (blank = all unsent)'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mfm-state          # never let build and send touch state/ at once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # a backlog of several episodes takes ~5 min each
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMAIL_HEADER_IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/email_assets/image.png
    steps:
      - name: ET gate (skip the off-season UTC trigger)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then want="17 2 * * 2-6"; else want="17 3 * * 2-6"; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not 10:17 PM ET for this trigger; skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Restore state
        # Build only needs to know what was last sent; everything else it
        # produces fresh (so stale emails from older builds never linger).
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p .tmp && cp state/last_sent_episode.json .tmp/ 2>/dev/null || true

      - name: Scrape
        id: scrape
        if: steps.gate.outputs.run == 'true'
        env:
          EPISODE_TITLE: ${{ inputs.title }}
        run: |
          set +e
          if [ -n "$EPISODE_TITLE" ]; then
            python tools/scrape_show_notes.py --title "$EPISODE_TITLE"
          else
            python tools/scrape_show_notes.py
          fi
          code=$?
          if [ $code -eq 2 ]; then echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi   # no new episode = normal no-op
          echo "new=true" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Transcribe
        if: steps.scrape.outputs.new == 'true'
        run: python tools/transcribe_episode.py

      - name: Summarize
        if: steps.scrape.outputs.new == 'true'
        run: python tools/summarize_episode.py

      - name: Build emails
        if: steps.scrape.outputs.new == 'true'
        run: python tools/build_email.py

      - name: Save state
        # always(): even on failure, replace the previous cycle's hand-off
        # files, so the send job never sees an older build's emails as current
        # (it refuses any episode without a matching fresh build).
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          rm -rf state/emails state/email_body.html state/last_built_episode.json state/scraped_episode.json
          for f in scraped_episode.json last_built_episode.json; do
            [ -f ".tmp/$f" ] && cp ".tmp/$f" state/
          done
          [ -d .tmp/emails ] && cp -R .tmp/emails state/emails
          git config user.name "mfm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state episode_summaries
          git diff --cached --quiet || git commit -m "build: $(date -u +%F) state update"
          git pull --rebase -q && git push -q
